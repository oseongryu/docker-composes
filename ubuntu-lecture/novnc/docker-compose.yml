services:
  lecture-novnc:
    build: .
    image: oseongryu/lecture-novnc:latest
    container_name: ${NAME:-lecture-novnc}
    # noVNC·녹음 콘솔 모두 인증이 없으므로 기본은 localhost 바인딩 (원격은 ssh -L 로 터널)
    ports:
      - "${BIND:-127.0.0.1}:${VNC_PORT:-6080}:6080"
      - "${BIND:-127.0.0.1}:${CONSOLE_PORT:-8090}:8090"
    volumes:
      - ${DATA_DIR:-./data}:/home/lecture
      - ${COURSE_DIR:-../../../../references/study}:/courses:ro
    environment:
      - RESOLUTION=${RESOLUTION:-1920x1080x24}
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - AUDIO_MODE=${AUDIO_MODE:-basic}
      - VNC_PORT=${VNC_PORT:-6080}
      - CONSOLE_PORT=${CONSOLE_PORT:-8090}
      - COURSE_XLSX=/courses/디지털 원격훈련 HRD 아카이브 과정 리스트.xlsx
    shm_size: "2g"
    restart: unless-stopped
