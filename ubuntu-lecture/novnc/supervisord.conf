[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_RESOLUTION)s -nolisten tcp -ac
priority=100
autorestart=true
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb.err.log

[program:pulseaudio]
command=/usr/bin/pulseaudio -n -F /etc/pulse/lecture.pa --daemonize=no --exit-idle-time=-1 --log-target=stderr
user=lecture
environment=HOME="/home/lecture",XDG_RUNTIME_DIR="/tmp/runtime-lecture"
priority=150
autorestart=true
stdout_logfile=/var/log/pulseaudio.log
stderr_logfile=/var/log/pulseaudio.err.log

[program:fluxbox]
command=/usr/bin/fluxbox
user=lecture
environment=HOME="/home/lecture",USER="lecture"
priority=200
autorestart=true
stdout_logfile=/var/log/fluxbox.log
stderr_logfile=/var/log/fluxbox.err.log

[program:autocutsel]
command=/usr/bin/autocutsel -selection CLIPBOARD -pause 50
user=lecture
environment=HOME="/home/lecture"
priority=250
autorestart=true
stdout_logfile=/var/log/autocutsel.log
stderr_logfile=/var/log/autocutsel.err.log

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -nopw -listen 0.0.0.0 -xkb -shared -forever -rfbport 5900 -quiet
priority=300
autorestart=true
stdout_logfile=/var/log/x11vnc.log
stderr_logfile=/var/log/x11vnc.err.log

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
priority=400
autorestart=true
stdout_logfile=/var/log/novnc.log
stderr_logfile=/var/log/novnc.err.log

[program:browser]
command=/usr/local/bin/browser --no-sandbox --no-first-run --start-maximized --user-data-dir=/home/lecture/.config/browser
user=lecture
environment=HOME="/home/lecture",USER="lecture"
priority=500
autorestart=unexpected
startretries=3
stdout_logfile=/var/log/browser.log
stderr_logfile=/var/log/browser.err.log

[program:notes]
command=/opt/venv/bin/python /app/server.py
user=lecture
environment=HOME="/home/lecture",USER="lecture"
directory=/home/lecture
priority=600
autorestart=true
stdout_logfile=/var/log/notes.log
stderr_logfile=/var/log/notes.err.log
