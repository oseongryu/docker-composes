[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
loglevel=info

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp -ac
priority=100
autorestart=true
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb.err.log

[program:fluxbox]
# plain fluxbox (startup 스크립트 미사용) — startup 의존성 끊고 안정성 확보
command=/usr/bin/fluxbox
environment=DISPLAY=":99",HOME="/data",USER="root"
priority=200
autorestart=true
stdout_logfile=/var/log/fluxbox.log
stderr_logfile=/var/log/fluxbox.err.log

[program:autocutsel-primary]
# X11 PRIMARY (마우스 드래그 선택) ↔ cutbuffer sync
command=/usr/bin/autocutsel -selection PRIMARY -pause 50
environment=DISPLAY=":99",HOME="/data"
priority=150
autorestart=true
stdout_logfile=/var/log/autocutsel-primary.log
stderr_logfile=/var/log/autocutsel-primary.err.log

[program:autocutsel-clipboard]
# X11 CLIPBOARD (Ctrl+C/V) ↔ cutbuffer sync — 두 데몬이 같이 돌면 PRIMARY ↔ CLIPBOARD 도 자동 일치
command=/usr/bin/autocutsel -selection CLIPBOARD -pause 50
environment=DISPLAY=":99",HOME="/data"
priority=150
autorestart=true
stdout_logfile=/var/log/autocutsel-clipboard.log
stderr_logfile=/var/log/autocutsel-clipboard.err.log

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -nopw -listen 0.0.0.0 -xkb -shared -forever -rfbport 5900 -quiet
priority=300
autorestart=true
stdout_logfile=/var/log/x11vnc.log
stderr_logfile=/var/log/x11vnc.err.log

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
priority=400
autorestart=true
stdout_logfile=/var/log/novnc.log
stderr_logfile=/var/log/novnc.err.log

[program:welcome]
# 안내 xterm — 한 번만 띄우고 사용자가 닫으면 재시작하지 않는다.
# fluxbox 가 자체 재시작 되더라도 이 program 은 영향 없음 (분리됨).
command=/app/welcome-xterm.sh
environment=DISPLAY=":99",HOME="/data",USER="root"
priority=500
autorestart=false
startsecs=0
startretries=0
exitcodes=0,15
stdout_logfile=/var/log/welcome.log
stderr_logfile=/var/log/welcome.err.log
