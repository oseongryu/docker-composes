# Docker Compose 파일 포맷 버전 지정
version: "2.2"

services:
  mariadb:
    container_name: db-mariadb
    image: mysql:5.7
    restart: always
    # 컨테이너에서 사용하는 volume 설정으로 대체 가능(옵션)
    volumes:
      - ./mysqldata:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASES=mydb
    stdin_open: true # docker run -i
    tty: true # docker run -t
    ports:
      - "3306:3306"
    # # 컨테이너 간 네트워크 분리를 위한 추가 설정 부분(옵션)
    # network:
  oracle:
    container_name: db-oracle
    build:
      context: ./oracle/
      dockerfile: Dockerfile
    image: db/oracle-free:23.26.3
    environment:
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-1234}
    volumes:
      - oradata:/opt/oracle/oradata
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    stdin_open: true # docker run -i
    tty: true # docker run -t
  mysql:
    container_name: db-mysql
    command: --character-set-server=utf8 --collation-server=utf8_general_ci
    build:
      context: ./mysql/
      dockerfile: Dockerfile
    image: db/mysql:8.0.38
    environment:
      - LC_ALL=C.UTF-8
      - MYSQL_DATABASE=testdb
      - MYSQL_ROOT_PASSWORD=1234
    ports:
      - "3306:3306"
    stdin_open: true # docker run -i
    tty: true # docker run -t
    privileged: true
    restart: always
  mongodb:
    container_name: db-mongodb
    build:
      context: ./mongodb/
      dockerfile: Dockerfile
    image: db/mongo:3.6
    environment:
      - MONGO_INITDB_ROOT_USERNAME=testdb
      - MONGO_INITDB_ROOT_PASSWORD=1234
      - MONGO_INITDB_DATABASE=db
    ports:
      - "27017:27017"
    stdin_open: true # docker run -i
    tty: true # docker run -t
  redis:
    container_name: db-redis
    build:
      context: ./redis/
      dockerfile: Dockerfile
    image: db/redis:latest
    ports:
      - "6379:6379"
    restart: always
    stdin_open: true # docker run -i
    tty: true # docker run -t
    privileged: true

volumes:
  oradata:
