services:
  postgresql:
    container_name: db-postgresql
    build:
      context: ./
      dockerfile: Dockerfile
    image: db/postgres:18.6
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-1234}
      - POSTGRES_DB=testdb
    volumes:
      # 18 부터 데이터 경로가 /var/lib/postgresql/18/docker 로 바뀌어 상위 경로를 마운트
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
